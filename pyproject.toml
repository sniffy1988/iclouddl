[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iclouddownloader"
version = "0.1.0"
description = "Multi-user iCloud Photos downloader with PostgreSQL tracking, Telegram alerts, and web admin UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyicloud>=2.6",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "click",
    "apscheduler",
    "pydantic-settings",
    "keyring",
    "httpx",
    "python-telegram-bot>=21",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "passlib[bcrypt]",
    "sse-starlette",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
iclouddownloader = "iclouddownloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iclouddownloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
