# SQLite file DB — all persistent data lives in ./data/ on the host
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/iclouddownloader.db}
      BASE_DOWNLOAD_DIR: /data/downloads
      COOKIE_DIR: /data/cookies
      RUN_MIGRATIONS: "true"
    volumes:
      - ./data:/data
    command: ["true"]
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/iclouddownloader.db}
      BASE_DOWNLOAD_DIR: /data/downloads
      COOKIE_DIR: /data/cookies
      REDIS_URL: redis://redis:6379/0
      WEB_HOST: 0.0.0.0
      WEB_PORT: ${WEB_PORT:-8765}
      FORCE_COLOR: ${FORCE_COLOR:-1}
    ports:
      - "${WEB_PORT:-8765}:${WEB_PORT:-8765}"
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["iclouddownloader", "web", "start"]
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/iclouddownloader.db}
      BASE_DOWNLOAD_DIR: /data/downloads
      COOKIE_DIR: /data/cookies
      REDIS_URL: redis://redis:6379/0
      FORCE_COLOR: ${FORCE_COLOR:-1}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["iclouddownloader", "daemon", "start"]
    restart: unless-stopped

  # SQLite browser (localhost only). Enable with: COMPOSE_PROFILES=dbviewer ./start.sh
  db-viewer:
    image: ghcr.io/coleifer/sqlite-web:latest
    profiles: ["dbviewer"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_VIEWER_PORT:-8766}:8080"
    volumes:
      - ./data:/data:ro
      - ./scripts/db-viewer-entrypoint.sh:/usr/local/bin/db-viewer-entrypoint.sh:ro
    environment:
      PYTHONUNBUFFERED: "1"
      DB_VIEWER_MODE: sqlite
      DB_VIEWER_PORT: ${DB_VIEWER_PORT:-8766}
      SQLITE_DATABASE: iclouddownloader.db
      SQLITE_WEB_PASSWORD: ${DB_VIEWER_PASSWORD:-}
    entrypoint: ["/bin/sh", "/usr/local/bin/db-viewer-entrypoint.sh"]
